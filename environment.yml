name: datascience
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pandas
  - numpy
  - scikit-learn
  - matplotlib
  - seaborn
  - jupyter
  - pillow>=13.0.0
  - pip
  - pip:
    - torch
    - torchvision
    - mlflow
    - boto3
    - python-dotenv
    - fastapi
    - uvicorn
    - python-multipart>=0.0.31
    - starlette>=1.3.1
    - slowapi
    - timm
    - kaggle
